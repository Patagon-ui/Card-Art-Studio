    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=MedievalSharp&family=Roboto+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0b1a;
            color: #e2e8f0;
            margin: 0;
            overflow-x: hidden;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .font-medieval {
            font-family: 'MedievalSharp', cursive;
        }

            font-family: 'Roboto Mono', monospace;
        }
        .font-elegant {
            font-family: 'Playfair Display', serif;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1528;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a3a6b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5e4a8a;
        }

        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        
        /* Utility for hiding scrollbar but allowing scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
